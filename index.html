<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penilai Laporan Ilmiah & KTI</title>
    <style>
      :root {
        --bg: #081827;
        --bg-2: #0d1f31;
        --panel: rgba(19, 31, 46, 0.92);
        --panel-2: rgba(24, 38, 55, 0.9);
        --line: rgba(148, 164, 188, 0.18);
        --text: #eff7ff;
        --muted: #a6bbd3;
        --primary: #4da3ff;
        --primary-2: #7d6dff;
        --success: #45d38b;
        --warning: #ffbb55;
        --danger: #ff7171;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 18px 64px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.8rem);
        letter-spacing: -0.03em;
      }

      .badge {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.03);
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.14);
        margin-bottom: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 700;
      }

      input, select, textarea {
        width: 100%;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 82px;
      }

      .rubric-header {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .criterion {
        display: grid;
        grid-template-columns: minmax(200px, 1.3fr) minmax(180px, 1.2fr) minmax(120px, 1fr);
        gap: 18px;
        align-items: start;
        padding: 16px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      .criterion:last-child { border-bottom: none; }

      .criterion-title {
        font-weight: 800;
        margin-bottom: 8px;
      }

      .criterion-desc {
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.93rem;
      }

      .weight {
        display: inline-block;
        margin-top: 10px;
        background: rgba(77, 163, 255, 0.09);
        border: 1px solid rgba(77, 163, 255, 0.2);
        color: #b7d9ff;
        font-size: 0.8rem;
        border-radius: 999px;
        padding: 5px 9px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease;
      }

      button:hover { transform: translateY(-1px); }

      .primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        color: var(--text);
      }

      .result-box {
        display: none;
        background: rgba(77,163,255,0.05);
        border-left: 4px solid var(--primary);
      }

      .score {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .grade {
        margin-top: 10px;
        font-weight: 800;
        color: var(--success);
      }

      .summary {
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.7;
      }

      .error {
        min-height: 24px;
        color: #ffc1c1;
        margin-top: 12px;
        font-weight: 700;
      }

      .footer-note {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      @media (max-width: 720px) {
        .criterion {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media print {
        body { background: white; color: #111; }
        .card { background: white; box-shadow: none; border-color: #dfeaf6; }
        .badge, .actions, .secondary, .primary { display: none !important; }
        .result-box { display: block !important; }
        label, .criterion-desc, .summary, .muted { color: #222; }
        input, select, textarea {
          color: #111;
          background: white;
          border-color: #dfeaf6;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Penilai Laporan Ilmiah & KTI</h1>
        <div class="badge">Gratis • Browser-based</div>
      </div>

      <section class="card">
        <div class="grid">
          <div>
            <label for="workType">Jenis Karya</label>
            <select id="workType">
              <option value="laporan">Laporan Ilmiah</option>
              <option value="kti">Karya Tulis Ilmiah</option>
            </select>
          </div>
          <div>
            <label for="title">Judul</label>
            <input id="title" type="text" placeholder="Masukkan judul karya" />
          </div>
          <div>
            <label for="author">Penulis</label>
            <input id="author" type="text" placeholder="Nama penulis" />
          </div>
          <div>
            <label for="reviewer">Penilai</label>
            <input id="reviewer" type="text" placeholder="Nama penilai" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="rubric-header">Rubrik Penilaian</h2>
        <div id="rubric"></div>

        <div class="actions">
          <button id="calculate" class="primary">Hitung Nilai</button>
          <button id="exportCsv" class="secondary" type="button">Export CSV</button>
          <button id="print" class="secondary" type="button">Cetak / PDF</button>
          <button id="reset" class="secondary" type="button">Reset</button>
        </div>

        <div id="error" class="error" aria-live="polite"></div>
      </section>

      <section id="resultBox" class="card result-box">
        <h2 style="margin-top: 0;">Hasil Penilaian</h2>
        <div id="finalScore" class="score">0 / 100</div>
        <div id="gradeText" class="grade">Predikat: -</div>
        <div id="summaryText" class="summary"></div>
      </section>

      <div class="footer-note">Aplikasi ini dibuat untuk evaluasi cepat, gratis, dan siap dipublish ke Netlify.</div>
    </div>

    <script>
      const criteria = [
        {
          name: 'Orisinalitas dan Relevansi',
          weight: 20,
          desc: 'Kebaruan, keaslian gagasan, dan kesesuaian topik dengan tujuan karya.'
        },
        {
          name: 'Sistematika dan Struktur',
          weight: 20,
          desc: 'Kelengkapan bagian karya, alur penulisan, dan keteraturan penyusunan.'
        },
        {
          name: 'Metode dan Ketepatan Ilmiah',
          weight: 25,
          desc: 'Kesesuaian metode, kejelasan prosedur, dan ketepatan penggunaan konsep.'
        },
        {
          name: 'Data, Analisis, dan Pembahasan',
          weight: 20,
          desc: 'Kualitas data, kecermatan analisis, dan hubungan hasil dengan tujuan.'
        },
        {
          name: 'Bahasa dan Referensi',
          weight: 15,
          desc: 'Kejelasan bahasa, konsistensi gaya, dan kualitas sitasi serta pustaka.'
        }
      ];

      const rubric = document.getElementById('rubric');

      function renderRubric() {
        rubric.innerHTML = criteria.map((item, index) => `
          <div class="criterion">
            <div>
              <div class="criterion-title">${item.name}</div>
              <div class="criterion-desc">${item.desc}</div>
              <span class="weight">Bobot: ${item.weight}%</span>
            </div>
            <div>
              <label for="score-${index}">Skor (1–4)</label>
              <select id="score-${index}" class="score-input">
                <option value="">Pilih skor</option>
                <option value="1">1 - Kurang</option>
                <option value="2">2 - Cukup</option>
                <option value="3">3 - Baik</option>
                <option value="4">4 - Sangat Baik</option>
              </select>
            </div>
            <div>
              <label for="note-${index}">Catatan</label>
              <textarea id="note-${index}" placeholder="Tuliskan catatan penilai"></textarea>
            </div>
          </div>
        `).join('');
      }

      function getGrade(score) {
        if (score >= 86) return ['A', 'Sangat Baik'];
        if (score >= 76) return ['B', 'Baik'];
        if (score >= 66) return ['C', 'Cukup'];
        return ['D', 'Perlu Perbaikan'];
      }

      function collectAssessment() {
        const scores = [...document.querySelectorAll('.score-input')];
        const notes = [...document.querySelectorAll('textarea[id^="note-"]')];
        const rows = criteria.map((item, index) => ({
          aspek: item.name,
          bobot: item.weight,
          skor: Number(scores[index].value),
          catatan: notes[index].value.trim()
        }));

        return rows;
      }

      document.getElementById('calculate').addEventListener('click', () => {
        const errorBox = document.getElementById('error');
        const resultBox = document.getElementById('resultBox');
        errorBox.textContent = '';

        const scoreInputs = [...document.querySelectorAll('.score-input')];
        if (scoreInputs.some((input) => input.value === '')) {
          errorBox.textContent = 'Harap pilih skor untuk semua aspek sebelum menghitung.';
          return;
        }

        let total = 0;
        scoreInputs.forEach((input, idx) => {
          total += (Number(input.value) / 4) * criteria[idx].weight;
        });

        const rounded = Math.round(total * 100) / 100;
        const [letter, desc] = getGrade(rounded);
        const type = document.getElementById('workType').value === 'kti' ? 'Karya Tulis Ilmiah (KTI)' : 'Laporan Ilmiah';
        const title = document.getElementById('title').value || 'Tanpa judul';
        const author = document.getElementById('author').value || 'Nama penulis belum diisi';
        const reviewer = document.getElementById('reviewer').value || 'Nama penilai belum diisi';

        document.getElementById('finalScore').textContent = `${rounded} / 100`;
        document.getElementById('gradeText').textContent = `Predikat: ${letter} - ${desc}`;
        document.getElementById('summaryText').textContent = `${type} "${title}" oleh ${author}. Penilai: ${reviewer}.`;
        resultBox.style.display = 'block';
      });

      document.getElementById('exportCsv').addEventListener('click', () => {
        const rows = collectAssessment();
        const errors = rows.filter((row) => row.skor === 0 || Number.isNaN(row.skor));
        if (errors.length > 0) {
          document.getElementById('error').textContent = 'Harap pilih skor terlebih dahulu sebelum mengekspor CSV.';
          return;
        }

        const csvRows = [
          ['Aspek', 'Bobot (%)', 'Skor', 'Catatan'],
          ...rows.map((row) => [row.aspek, row.bobot, row.skor, row.catatan])
        ];

        const csv = csvRows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'hasil-penilaian-kti.csv';
        link.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('print').addEventListener('click', () => window.print());

      document.getElementById('reset').addEventListener('click', () => {
        document.getElementById('workType').value = 'laporan';
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        document.getElementById('reviewer').value = '';
        document.querySelectorAll('.score-input').forEach((el) => (el.value = ''));
        document.querySelectorAll('textarea[id^="note-"]').forEach((el) => (el.value = ''));
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('error').textContent = '';
      });

      renderRubric();
    </script>
  </body>
</html>
